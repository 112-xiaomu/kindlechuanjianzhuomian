name: Update Display

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render display
        run: python render.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index.html display.png display_portrait.png display_landscape_cw.png display_landscape_ccw.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update display $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
